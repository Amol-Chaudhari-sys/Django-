<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{page}}</title>
    <style>
      body {
        content-align: center;
      }
      .container {
        margin: 10px;
        text-align: center;
        border: 2px solid black;
        border-radius: 30px;
        content-align: center;
      }

      .form-control {
        width: 60%;
        padding: 5px;
        margin: 10px;
      }
      .btn {
        background-color: green;
        padding: 5px;
        margin: 20px;
        border-radius: 3px;
      }
      .btn-denger {
        padding: 5px;
        background-color: red;
        border-radius: 3px;
        margin: 15px;
        width: 70%;
      }
      .btn-success {
        padding: 5px;
        background-color: green;
        border-radius: 3px;
        margin: 15px;
        width: 70%;
      }
      .table-container{
        width: 98%;
        border: 3px solid black;
        margin: 10px;
        padding: 10px:
      }

      .alert-alert-primary {
        background-color: #ff0808;
        width: 60%;
        border-radius: 5px;
        justify-content: center;
        text-align: center;
        border: 2px solid black;
        border-radius: 30px;
      }

      .alert-container {
        display: flex;
        justify-content: center;
      }
      .navbar {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #a932ee;
        color: white;
        height: 60px;
        position: relative;
        border-radius: 7px;
        border: 2px solid blue;
      }
      .nav-btn {
        position: absolute;
        right: 20px;
        padding: 8px 16px;
        border: none;
        background: #9c00f7;
        color: white;
        border-radius: 7px;
        cursor: pointer;
        font-size: 16px;
        border: 2px solid blue;
      }
    </style>

    {% comment %}
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    {% endcomment %}
  </head>
  <body>
    <nav class="navbar">
      <h1>Students </h1>
      <button class="nav-btn">
        {%if request.user.is_authenticated%}
        <a href="/logout_page/"> Logout </a>
        {% else %}
        <a href="/login_page/"> Login </a>

        {% endif %}
      </button>
    </nav>

    {% block start%} {% endblock %}
  </body>
</html>
